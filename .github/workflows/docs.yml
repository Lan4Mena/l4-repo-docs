name: Desplegar GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs-repo/**"
      - ".agents/skills/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar documentación de Skills
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types docs-repo/scripts/generate-skills-docs.ts

      - name: Generar documentación de PR Templates
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types docs-repo/scripts/generate-pr-template-docs.ts

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs-repo

      - name: Compilar Jekyll
        env:
          BUNDLE_GEMFILE: docs-repo/Gemfile
        run: bundle exec jekyll build --config docs-repo/_config.yml --destination ./_site

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
